<!DOCTYPE html>

<html lang="ar">

  <title>حاسبة الذهب</title>

  <link rel="stylesheet" href="style.css">

  <script type="module" src="js/main.js" defer></script>

</head>

<body>

  <div class="container">

    <h1>حاسبة الذهب</h1>

    <div class="card">
      <div class="input-group">

  <label>سعر الأونصة العالمي (USD)</label>

  <input type="number" id="ounce" placeholder="مثال: 5000">

</div>

<div class="input-group">

  <label>سعر الصرف (USD → IQD)</label>

  <input type="number" id="exchange" placeholder="مثال: 1530">

</div>

      <div class="input-group">

        <label>عدد الغرامات</label>

        <input type="number" id="grams">

      </div>

      <button id="calculate">احسب السعر</button>

      <div class="result">

        <h2 id="price">0 IQD</h2>

      </div>

    </div>
